name: Verify and deploy personal operations
on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migration report contract tests
        run: npm run migration:test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:browser
        working-directory: apps/web
      - name: Retirement acceptance rehearsal
        shell: bash
        run: |
          set +e
          npm run migration:rehearse -- --snapshot tools/migration/fixtures/personal-source.json --installation synthetic --kind synthetic --out migration-runs/ci
          result=$?
          test "$result" -eq 2 || exit 1
          node tools/migration/verify-rehearsal.mjs migration-runs/ci/migration-report.json
      - name: Preserve safe synthetic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-migration-report
          path: |
            migration-runs/ci/migration-report.json
            migration-runs/ci/migration-report.md
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: apps/web/dist
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
